services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: saldo-rabbitmq
    hostname: saldo-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: saldo
      RABBITMQ_DEFAULT_PASS: saldo_dev_password
      RABBITMQ_DEFAULT_VHOST: saldo

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
